[project]
name = "finsight-streamer"
version = "0.1.0"
description = "FinSight AI exchange websocket streaming service"
requires-python = ">=3.12"
dependencies = [
    "finsight-core",
    "websockets>=14.0",
    "redis>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight_streamer"]

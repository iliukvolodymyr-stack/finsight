[project]
name = "finsight-ml"
version = "0.1.0"
description = "FinSight AI ML and analytics engine"
requires-python = ">=3.12"
dependencies = [
    "finsight-core",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "pyarrow>=18.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
finsight-ml = "finsight_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finsight_ml"]

[project]
name = "finsight-ai-workspace"
version = "0.1.0"
description = "FinSight AI monorepo workspace"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
    "types-pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
    "services/py-core",
    "services/api",
    "services/ml",
    "services/streamer",
]

[tool.uv.sources]
finsight-core = { workspace = true }
finsight-ml = { workspace = true }
finsight-streamer = { workspace = true }
finsight-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008", "E741"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = [
    "services/py-core/src",
    "services/ml/src",
    "services/api",
    "services/streamer/src",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pandas.*",
    "scipy.*",
    "sklearn.*",
    "lightgbm.*",
    "joblib.*",
    "redis.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "finsight_ml.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "services/api",
    "services/ml/src",
    "services/py-core/src",
    "services/streamer/src",
]
testpaths = [
    "services/api/tests",
    "services/ml/tests",
]
asyncio_mode = "auto"

[package]
name = "finsight-desktop"
version = "0.1.0"
description = "FinSight AI — Кросплатформна інтелектуальна система аналізу фінансових активів"
authors = ["FinSight AI"]
edition = "2021"

[lib]
name = "finsight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

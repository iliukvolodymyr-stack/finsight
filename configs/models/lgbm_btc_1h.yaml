name: lgbm_btc_1h
version: 0.1.0
model_type: lightgbm
symbol: BTCUSDT
timeframe: 1h
horizon_bars: 24

labeling:
  method: triple_barrier
  pt_mult: 2.0
  sl_mult: 2.0
  horizon_bars: 24

hyperparameters:
  n_estimators: 150
  learning_rate: 0.05
  max_depth: 5
  num_leaves: 31
  random_state: 42

features:
  - logret_1
  - logret_3
  - logret_6
  - logret_12
  - logret_24
  - norm_dist_ema20
  - norm_dist_ema50
  - norm_dist_ema200
  - ema_ratio_20_50
  - ema_ratio_50_200
  - macd_line
  - macd_signal
  - macd_hist
  - rsi14
  - atr14_norm
  - bb_width

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: finsight-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
      POSTGRES_DB: finsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight -d finsight"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finsight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: finsight-worker
    profiles: ["ingest"]
    restart: always
    environment:
      APP_ENV: local
      AUTH_MODE: single_user
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@postgres:5432/finsight
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.worker.celery_app",
        "worker",
        "-l",
        "INFO",
        "-c",
        "2",
        "-Q",
        "default,ingest,inference,nlp,alerts",
      ]

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: finsight-beat
    profiles: ["ingest"]
    restart: always
    environment:
      APP_ENV: local
      AUTH_MODE: single_user
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@postgres:5432/finsight
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "uv",
        "run",
        "celery",
        "-A",
        "app.worker.celery_app",
        "beat",
        "-l",
        "INFO",
        "-s",
        "/tmp/celerybeat-schedule",
      ]

volumes:
  pgdata:
  redisdata:
